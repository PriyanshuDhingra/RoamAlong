[project]
name = "wander"
version = "0.1.0"
description = "Realtime, location-aware voice tour guide (Boson Higgs Audio Hackathon 2026)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=13",
  "pydantic>=2.9",
  "orjson>=3.10",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "h3>=4.1",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "jsonschema>=4.23",
  "datamodel-code-generator>=0.26",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "pipeline/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["protocol/gen"]
